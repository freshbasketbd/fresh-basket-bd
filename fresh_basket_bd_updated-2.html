<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fresh Basket BD — অনলাইন গ্রোসারি শপ</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Noto Sans Bengali",sans-serif;
  background:#f7f9f7;
  color:#222;
}

header{
  background:#16823b;
  color:white;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #0002;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#ffd43b;
}

.cart-btn{
  background:#ff9f1c;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
  font-family:inherit;
}

.hero{
  background:linear-gradient(135deg,#16823b,#28a745);
  color:white;
  padding:35px 20px;
  text-align:center;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  font-family:inherit;
  outline:none;
}

.search-box input:focus{
  border-color:#16823b;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
  padding-bottom:5px;
}

.categories button{
  border:1px solid #16823b;
  background:white;
  color:#16823b;
  padding:8px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-family:inherit;
}

.categories button.active,
.categories button:hover{
  background:#16823b;
  color:white;
}

.section-title{
  font-size:23px;
  margin-bottom:15px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px #0001;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
}

.product-image{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f7f3;
  position:relative;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-icon{
  font-size:70px;
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:#ff9f1c;
  color:white;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
}

.product-info{
  padding:13px;
}

.product-info h3{
  font-size:17px;
  margin-bottom:5px;
}

.category{
  color:#777;
  font-size:13px;
}

.price{
  color:#16823b;
  font-size:19px;
  font-weight:800;
  margin-top:8px;
}

.unit{
  color:#777;
  font-size:13px;
}

.add-btn{
  width:100%;
  margin-top:10px;
  padding:9px;
  border:0;
  background:#16823b;
  color:white;
  border-radius:7px;
  cursor:pointer;
  font-family:inherit;
}

.add-btn:hover{
  background:#116b31;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
  grid-column:1/-1;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-card{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.modal-card h2{
  margin-bottom:18px;
}

.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.cart-name{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:1px solid #ddd;
  background:white;
  border-radius:5px;
  cursor:pointer;
}

.total{
  font-size:20px;
  font-weight:800;
  color:#16823b;
  margin:15px 0;
}

.order-form input,
.order-form textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:7px;
  font-family:inherit;
  font-size:15px;
}

.order-form textarea{
  min-height:80px;
  resize:vertical;
}

.order-btn{
  width:100%;
  background:#16823b;
  color:white;
  border:0;
  padding:12px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  font-family:inherit;
}

.loading{
  text-align:center;
  padding:40px;
  grid-column:1/-1;
}

footer{
  margin-top:40px;
  background:#126b32;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  display:none;
  z-index:1000;
}

@media(max-width:800px){
  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .header-inner{
    flex-direction:row;
  }

  .hero h1{
    font-size:24px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-image{
    height:135px;
  }

  .product-icon{
    font-size:55px;
  }

  .product-info{
    padding:10px;
  }

  .product-info h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }
}
</style></head><body><header>
  <div class="header-inner">
    <div class="logo">🛒 Fresh <span>Basket</span> BD</div>
    <button class="cart-btn" onclick="showCart()">
      🛒 কার্ট (<span id="cartCount">0</span>)
    </button>
  </div>
</header><section class="hero">
  <h1>Fresh Basket BD</h1>
  <p>তাজা পণ্য, সহজে অর্ডার করুন</p>
</section><main class="container">  <div class="search-box">
    <input
      type="text"
      placeholder="🔎 পণ্য খুঁজুন..."
      oninput="searchProducts(this.value)"
    >
  </div>  <div class="categories" id="categories">
    <button class="active" onclick="filterCategory('all',this)">
      সব পণ্য
    </button>
  </div>  <h2 class="section-title">আমাদের পণ্য</h2>  <div class="product-grid" id="productGrid">
    <div class="loading">পণ্য লোড হচ্ছে...</div>
  </div></main><footer>
  <h3>Fresh Basket BD</h3>
  <p>আপনার বিশ্বস্ত অনলাইন গ্রোসারি শপ</p>
</footer><!-- CART MODAL --><div class="modal" id="cartModal">  <div class="modal-card"><button class="close" onclick="closeCart()">×</button>

<h2>🛒 আপনার কার্ট</h2>

<div id="cartItems"></div>

<div class="total">
  মোট: ৳<span id="cartTotal">0</span>
</div>

<div class="order-form">

  <h3 style="margin-bottom:10px;">অর্ডারের তথ্য</h3>

  <input
    id="name"
    type="text"
    placeholder="আপনার নাম"
  >

  <input
    id="phone"
    type="tel"
    placeholder="মোবাইল নম্বর"
  >

  <textarea
    id="address"
    placeholder="ডেলিভারি ঠিকানা"
  ></textarea>

  <button class="order-btn" onclick="submitOrder()">
    অর্ডার করুন
  </button>

</div>

  </div></div><div class="toast" id="toast"></div><script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBZwu_NOP36QQqHmFatF4kGPapVBFe8t2I",
  authDomain: "fresh-basket-bd.firebaseapp.com",
  projectId: "fresh-basket-bd",
  storageBucket: "fresh-basket-bd.firebasestorage.app",
  messagingSenderId: "419953977573",
  appId: "1:419953977573:web:7841b5851dac96b1380c0c",
  measurementId: "G-WC771F869Y"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


let products = [];
let cart = JSON.parse(localStorage.getItem("fbb_cart") || "[]");

let currentCategory = "all";
let searchText = "";


/* FIRESTORE PRODUCTS */

onSnapshot(
  collection(db, "products"),
  snapshot => {

    products = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    createCategories();
    renderProducts();

  },
  error => {

    console.error(error);

    document.getElementById("productGrid").innerHTML =
      `<div class="empty">
        পণ্য লোড করা যাচ্ছে না।<br>
        পরে আবার চেষ্টা করুন।
      </div>`;

  }
);


/* CATEGORY */

function createCategories(){

  const box = document.getElementById("categories");

  const categories = [
    ...new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    )
  ];

  box.innerHTML = `
    <button
      class="${currentCategory === "all" ? "active" : ""}"
      onclick="filterCategory('all',this)">
      সব পণ্য
    </button>
  `;

  categories.forEach(category => {

    const button = document.createElement("button");

    button.textContent = category;

    if(category === currentCategory){
      button.classList.add("active");
    }

    button.onclick = function(){
      filterCategory(category,this);
    };

    box.appendChild(button);

  });
}


/* RENDER */

function renderProducts(){

  const grid = document.getElementById("productGrid");

  let list = products.filter(p => {

    const matchCategory =
      currentCategory === "all" ||
      p.category === currentCategory;

    const text =
      `${p.name || ""} ${p.category || ""}`.toLowerCase();

    const matchSearch =
      !searchText ||
      text.includes(searchText.toLowerCase());

    return matchCategory && matchSearch;

  });


  if(!list.length){

    grid.innerHTML =
      `<div class="empty">
        কোনো পণ্য পাওয়া যায়নি।
      </div>`;

    return;
  }


  grid.innerHTML = list.map(p => {

    const image = p.imageUrl
      ? `<img src="${p.imageUrl}" alt="${escapeHtml(p.name || "Product")}">`
      : `<div class="product-icon">${p.emoji || "🛒"}</div>`;


    return `
      <div class="product-card">

        <div class="product-image">

          ${p.badge
            ? `<div class="badge">${escapeHtml(p.badge)}</div>`
            : ""
          }

          ${image}

        </div>

        <div class="product-info">

          <h3>${escapeHtml(p.name || "পণ্য")}</h3>

          <div class="category">
            ${escapeHtml(p.category || "")}
          </div>

          <div class="price">
            ৳${Number(p.price || 0).toLocaleString("bn-BD")}
          </div>

          <div class="unit">
            ${escapeHtml(p.unit || "")}
          </div>

          <button
            class="add-btn"
            onclick="addToCart('${p.id}')">
            🛒 কার্টে যোগ করুন
          </button>

        </div>

      </div>
    `;

  }).join("");

}


/* SEARCH */

window.searchProducts = function(value){

  searchText = value.trim();

  renderProducts();

};


/* CATEGORY FILTER */

window.filterCategory = function(category, button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

};


/* ADD TO CART */

window.addToCart = function(id){

  const product = products.find(p => p.id === id);

  if(!product) return;


  const existing = cart.find(x => x.id === id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price || 0),
      unit: product.unit || "",
      qty: 1
    });

  }


  saveCart();

  showToast("পণ্যটি কার্টে যোগ হয়েছে");

};


/* CART */

function saveCart(){

  localStorage.setItem(
    "fbb_cart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce((sum,item) => sum + item.qty,0);

  document.getElementById("cartCount").textContent = count;

}


function cartTotal(){

  return cart.reduce(
    (sum,item) =>
      sum + item.price * item.qty,
    0
  );

}


/* SHOW CART */

window.showCart = function(){

  renderCart();

  document
    .getElementById("cartModal")
    .classList.add("show");

};


window.closeCart = function(){

  document
    .getElementById("cartModal")
    .classList.remove("show");

};


/* RENDER CART */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(!cart.length){

    box.innerHTML =
      `<p style="text-align:center;padding:20px">
        আপনার কার্ট খালি।
      </p>`;

  }else{

    box.innerHTML = cart.map(item => `

      <div class="cart-item">

        <div class="cart-name">

          <b>${escapeHtml(item.name)}</b>

          <div style="font-size:13px;color:#777">
            ৳${item.price.toLocaleString("bn-BD")}
            ${escapeHtml(item.unit)}
          </div>

        </div>

        <div class="qty">

          <button onclick="changeQty('${item.id}',-1)">
            −
          </button>

          <b>${item.qty}</b>

          <button onclick="changeQty('${item.id}',1)">
            +
          </button>

        </div>

      </div>

    `).join("");

  }


  document.getElementById("cartTotal").textContent =
    cartTotal().toLocaleString("bn-BD");

}


window.changeQty = function(id,change){

  const item = cart.find(x => x.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){

    cart = cart.filter(x => x.id !== id);

  }

  saveCart();
  renderCart();

};


/* SUBMIT ORDER */

window.submitOrder = async function(){

  if(!cart.length){

    alert("আপনার কার্ট খালি।");

    return;
  }


  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();


  if(!name || !phone || !address){

    alert("নাম, মোবাইল নম্বর এবং ঠিকানা দিন।");

    return;
  }


  const total = cartTotal();


  const orderData = {

    customer: name,

    phone: phone,

    address: address,

    items: cart.map(item => ({

      productId: item.id,

      name: item.name,

      price: item.price,

      unit: item.unit,

      qty: item.qty

    })),

    total: total,

    status: "নতুন",

    createdAt: serverTimestamp()

  };


  try{

    await addDoc(
      collection(db,"orders"),
      orderData
    );


    cart = [];

    saveCart();

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";

    closeCart();

    alert("অর্ডার সফলভাবে গ্রহণ করা হয়েছে।");

  }catch(error){

    console.error(error);

    alert(
      "অর্ডার পাঠানো যায়নি। আবার চেষ্টা করুন।"
    );

  }

};


/* TOAST */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(() => {

    toast.style.display = "none";

  },2000);

}


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


updateCartCount();

</script></body>
</html>
